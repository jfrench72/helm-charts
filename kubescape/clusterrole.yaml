apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescape
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

- apiGroups: ["apps", "batch", "autoscaling", "extensions"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

- apiGroups: ["networking.k8s.io", "policy", "rbac.authorization.k8s.io", "storage.k8s.io",
              "admissionregistration.k8s.io", "authentication.k8s.io", "authorization.k8s.io",
              "apiregistration.k8s.io", "coordination.k8s.io", "discovery.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

- apiGroups: ["hostdata.kubescape.cloud"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

